# @package task
defaults:
  - command/future_steps: short
  - observation/priv: root_body_actions
  - observation/command: joint
  - termination: adam_lite_jump
  - motion: adam_lite/jump
  - _self_

name: AdamLiteJumpTrack
project: mimic_lite
nan_guard: sanitize

shared:
  root_body_name: pelvis
  anchor_body_name: pelvis
  reward_root_body_name: pelvis
  termination_root_body_name: pelvis
  obs_body_names:
    - pelvis
    - shinLeft
    - shinRight
    - toeLeft
    - toeRight
  tracking_body_names:
    - pelvis
    - torso
    - thighLeft
    - thighRight
    - shinLeft
    - shinRight
    - toeLeft
    - toeRight
  tracking_joint_names:
    - hipPitch_Left
    - hipRoll_Left
    - hipYaw_Left
    - kneePitch_Left
    - anklePitch_Left
    - ankleRoll_Left
    - hipPitch_Right
    - hipRoll_Right
    - hipYaw_Right
    - kneePitch_Right
    - anklePitch_Right
    - ankleRoll_Right
  reward_joint_names:
    - hipPitch_Left
    - hipRoll_Left
    - hipYaw_Left
    - kneePitch_Left
    - anklePitch_Left
    - ankleRoll_Left
    - hipPitch_Right
    - hipRoll_Right
    - hipYaw_Right
    - kneePitch_Right
    - anklePitch_Right
    - ankleRoll_Right

viewer:
  resolution: [1280, 720]
  lookat: [0.0, 0.0, 0.0]
  eye: [4.0, 4.0, 4.0]

terrain: plane
enable_cameras: false

num_envs: 8192
max_episode_length: 1100

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  nconmax: 128
  njmax: 640
  mjlab_nconmax: 128
  mjlab_njmax: 640
  mjlab_occupancy_diagnostics: false

robot:
  name: adam_lite_12dof

input:
  action:
    _target_: mimic_lite.JointPosition
    residual: true
    action_scaling:
      .*: 0.35
    min_delay: 1
    max_delay: 1
    alpha_range: [1.0, 1.0]

command:
  _target_: mimic_lite.RobotTracking
  motion_cfgs: ???
  tracking_body_names: ${task.shared.tracking_body_names}
  obs_body_names: ${task.shared.obs_body_names}
  tracking_joint_names: ${task.shared.tracking_joint_names}
  diff_future_steps: [0, 1]
  root_body_name: ${task.shared.root_body_name}
  anchor_body_name: ${task.shared.anchor_body_name}
  rsi: true
  rsi_margin_frames: 50
  rsi_mode: phase_balanced
  rsi_phase_edges: [0.0, 0.12, 0.28, 0.42, 0.55, 0.75, 1.0]
  rsi_phase_weights: [0.10, 0.15, 0.25, 0.15, 0.25, 0.10]
  pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    z: [-0.01, 0.01]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.1, 0.1]
  velocity_range:
    x: [-0.2, 0.2]
    y: [-0.2, 0.2]
    z: [-0.2, 0.2]
    roll: [-0.5, 0.5]
    pitch: [-0.5, 0.5]
    yaw: [-0.5, 0.5]
  init_joint_pos_noise: 0.0
  init_joint_vel_noise: 0.0
  rewind_prob: 0.8
  rewind_steps_range: [25, 125]

observation:
  policy:
    root_ang_vel_history:
      _target_: mimic_lite.root_ang_vel_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.2
    projected_gravity_history:
      _target_: mimic_lite.projected_gravity_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.01
    joint_pos_history:
      _target_: mimic_lite.joint_pos_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.02
    joint_vel_history:
      _target_: mimic_lite.joint_vel_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.5
    prev_actions:
      _target_: mimic_lite.prev_actions
      steps: 3
  ref_joint_pos_:
    ref_joint_action:
      _target_: mimic_lite.ref_joint_action
  _motion_length:
    motion_length:
      _target_: mimic_lite.motion_length

reward:
  tracking:
    root_pos:
      _target_: mimic_lite.body_pos_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      enabled: true
      weight: 3.5
      sigma: 0.30
    root_ori:
      _target_: mimic_lite.body_ori_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 2.0
      sigma: 0.20
    root_linvel:
      _target_: mimic_lite.body_lin_vel_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 1.5
      sigma: 1.0
    root_angvel:
      _target_: mimic_lite.body_ang_vel_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 0.5
      sigma: 2.5
    body_pos:
      _target_: mimic_lite.body_pos_local_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      sigma: 0.3
    body_ori:
      _target_: mimic_lite.body_ori_local_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      sigma: 0.4
    body_linvel:
      _target_: mimic_lite.body_lin_vel_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 0.5
      sigma: 1.0
    body_angvel:
      _target_: mimic_lite.body_ang_vel_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 0.5
      sigma: 2.5
    joint_pos:
      _target_: mimic_lite.joint_pos_tracking_product
      joint_names: ${task.shared.reward_joint_names}
      weight: 2.5
      sigma: 0.25
    joint_vel:
      _target_: mimic_lite.joint_vel_tracking_product
      joint_names: ${task.shared.reward_joint_names}
      weight: 1.2
      sigma: 4.0
  loco:
    action_rate_l2: {weight: 0.02, enabled: true}
    residual_l2:
      _target_: mimic_lite.residual_l2
      weight: 0.08
      enabled: true
    joint_vel_l2: {weight: 5.0e-4, joint_names: .*}
    joint_pos_limits:
      _target_: mimic_lite.joint_pos_limits
      weight: 10.0
      joint_names: ".*"
      soft_factor: 0.95
      enabled: true
    self_collisions:
      _target_: mimic_lite.self_collisions
      weight: -0.5
      enabled: true
      sensor_name: self_collision
      force_threshold: 1.0
    feet_slip:
      _target_: mimic_lite.feet_slip
      weight: 0.4
      tolerance: 0.0
      enabled: true
      body_names: [toeLeft, toeRight]
    feet_force_excess:
      _target_: mimic_lite.feet_force_excess
      weight: 0.6
      enabled: true
      body_names: [toeLeft, toeRight]
      threshold: 500.0
    feet_air_time:
      _target_: mimic_lite.feet_air_time
      weight: 4.0
      enabled: false
      body_names: [toeLeft, toeRight]
      thres: 0.8
      height_range: [0.05, 0.15]
      time_factor_range: [0.2, 1.0]
    survival: {weight: 0.25, enabled: true}
  tracking_metrics:
    _enabled_: false
    root_pos:
      _target_: mimic_lite.body_pos_error
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 1.0
      enabled: false
    root_ori:
      _target_: mimic_lite.body_ori_error
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 1.0
      enabled: false
    body_pos:
      _target_: mimic_lite.body_pos_error_local
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      enabled: false
    body_ori:
      _target_: mimic_lite.body_ori_error_local
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      enabled: false
    joint_pos:
      _target_: mimic_lite.joint_pos_error
      joint_names: ${task.shared.reward_joint_names}
      weight: 1.0
      enabled: false
  loco_metrics:
    _enabled_: false
    joint_pos_limits:
      _target_: mimic_lite.joint_pos_limits
      weight: 1.0
      joint_names: ".*"
      soft_factor: 0.95
      enabled: false
    feet_contact_count:
      _target_: mimic_lite.feet_contact_count
      weight: 1.0
      enabled: false
      body_names: [toeLeft, toeRight]
    feet_contact_duration:
      _target_: mimic_lite.feet_contact_duration
      weight: 1.0
      enabled: false
      body_names: [toeLeft, toeRight]

randomization:
  perturb_body_materials:
    body_names: [toeLeft, toeRight]
    static_friction_range: [0.4, 1.6]
    dynamic_friction_range: [0.4, 1.2]
    restitution_range: [0.0, 0.5]
    solref_time_constant_range: [0.015, 0.03]
    solref_dampratio_range: [0.5, 2.0]
    homogeneous: true
  perturb_body_mass:
    pelvis: [0.95, 1.05]
  perturb_body_com:
    pelvis: [-0.03, 0.03]
  actuator_params:
    stiffness_range:
      ".*(hip|knee|ankle).*": [0.8, 1.2]
    damping_range:
      ".*(hip|knee|ankle).*": [0.8, 1.2]
    armature_range:
      .*: [0.75, 1.25]
    friction_range:
      .*: [0.05, 0.25]
  random_joint_offset:
    .*: [-0.01, 0.01]
